# TEST VARIANT – scenario 3 for support-ai Building (job runs only for pull requests).
# Restore the normal build.yml after the test.
name: Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx ng build
