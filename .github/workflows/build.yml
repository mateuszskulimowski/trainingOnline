# TEST VARIANT – scenario 5 for support-ai Building (environment gate).
# Restore the normal build.yml after the test.
name: Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: build-approval
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx ng build
