# Builds every branch on push (not only pull requests): support-ai builds a
# request's branch before any pull request exists, and reads the result of the
# `build` job. It can also start this workflow through the API (workflow_dispatch).
name: Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx ng build
