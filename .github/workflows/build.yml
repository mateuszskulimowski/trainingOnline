# TEST VARIANT – scenario 1 for support-ai Building; restore the normal build.yml after the test
# Triggers only on pull requests (no push, no workflow_dispatch), so a pushed
# `ai/ticket-*` branch gets no build before a pull request exists.
name: Build

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx ng build
