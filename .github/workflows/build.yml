# TEST VARIANT – scenario 2 for support-ai Building (push filtered by paths).
# Restore the normal build.yml after the test.
name: Build

on:
  push:
    branches: ['**']
    paths: ['src/environments/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx ng build
