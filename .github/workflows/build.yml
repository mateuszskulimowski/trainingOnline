# TEST VARIANT – scenario 9 for support-ai Building (build longer than the run window).
# Restore the normal build.yml after the test.
name: Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: sleep 150

      - run: npx ng build
