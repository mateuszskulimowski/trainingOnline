# TEST VARIANT – scenario 8 for support-ai Building (job-level continue-on-error that fails).
# Restore the normal build.yml after the test.
name: Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx ng build

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - run: echo "lint is allowed to fail" && exit 1
